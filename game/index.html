<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberwake — a storm-caller arena survival game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0610; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh;
         font-family: system-ui, sans-serif; color: #f4ead8; }
  .frame { text-align: center; padding: 12px; }
  canvas { width: min(96vw, 1280px); height: auto; aspect-ratio: 16 / 9; display: block;
           background: #140b16; border: 1px solid rgba(244, 234, 216, 0.18);
           border-radius: 10px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6); cursor: crosshair; }
  p.hint { margin: 10px 0 0; font-size: 13px; color: #a89a83; }
  p.hint b { color: #ffd23c; font-weight: 600; }
  body.shot .frame { padding: 0; }
  body.shot p.hint { display: none; }
  body.shot canvas { width: 100vw; border: none; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
  <div class="frame">
    <canvas id="game" width="1280" height="720"></canvas>
    <p class="hint"><b>WASD</b> move · <b>Mouse</b> aim, hold to cast · <b>Space</b> dash · <b>1/2/3</b> Ember / Frost / Storm · <b>P</b> pause</p>
  </div>
  <script>if (new URLSearchParams(location.search).has('shot')) document.body.classList.add('shot');</script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
